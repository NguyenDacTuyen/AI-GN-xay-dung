# =====================================================================================
#  FILE KHAI BÁO DỰ ÁN (MẪU) - dùng chung cho 3 chương trình:
#    python/chuyen_f1_ve_mau_ha_tang.py  : file F1 xuất ra -> dự toán hạng mục theo mẫu công ty
#    python/tong_hop_du_toan.py          : các hạng mục -> bảng tổng hợp dự toán
#    python/thuyet_minh_du_toan.py       : bảng tổng hợp -> thuyết minh dự toán (Word)
#
#  CÁCH DÙNG:
#    1. Chép file này vào thư mục kết quả của dự án, ví dụ ket-qua/nha-xuong-a/khai-bao-du-an.ini
#    2. Mở bằng Notepad, điền thông tin sau dấu "=" (không cần dấu ngoặc kép), lưu lại.
#    3. Chạy lần lượt (gõ trong cửa sổ lệnh, đứng ở thư mục AI_Cad_K1):
#         python python/chuyen_f1_ve_mau_ha_tang.py ket-qua/nha-xuong-a/khai-bao-du-an.ini
#         python python/tong_hop_du_toan.py         ket-qua/nha-xuong-a/khai-bao-du-an.ini
#         python python/thuyet_minh_du_toan.py      ket-qua/nha-xuong-a/khai-bao-du-an.ini
#
#  QUY ƯỚC:
#    - Dòng bắt đầu bằng dấu # là ghi chú, chương trình bỏ qua.
#    - Ô nào chưa có thông tin thì để trống: chương trình ghi "......" và tô vàng để anh bổ sung sau.
#    - Tên file: chỉ cần ghi tên, file nằm cùng thư mục với file khai báo này.
#    - Chương trình không ghi đè file kết quả đã có. Muốn lập lại thì xóa (hoặc đổi tên) file kết quả cũ.
# =====================================================================================

